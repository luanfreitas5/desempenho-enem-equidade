# Amostragem, validação e hiperparâmetros dos modelos.
modeling:
  # Amostra aleatória (com semente) das linhas da gold para treino/avaliação.
  # Use null para usar todos os participantes (exige mais memória e tempo).
  sample_size: 500000
  test_size: 0.2
  n_splits: 5
  confidence_level: 0.95
  n_bootstrap: 500
  gradient_boosting:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 10.0
    n_jobs: -1
