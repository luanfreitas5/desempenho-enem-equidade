site_name: Desempenho no ENEM e Equidade
site_description: Modelo explicável da nota do ENEM por perfil socioeconômico e análise de equidade.
repo_url: https://github.com/luanfreitas5/desempenho-enem-equidade
docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Início: index.md
  - Dicionário de dados: dicionario_dados.md
  - Metodologia: metodologia.md
  - Referência da API: api.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
