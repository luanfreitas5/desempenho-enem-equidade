# =============================================================================
# pyproject.toml — fonte única de verdade para dependências, grupos e configuração
# de ferramentas (formato do template scaffolding-ds-projects).
# Gerenciador: uv. O lock file (uv.lock) DEVE ser commitado (`uv lock`).
# =============================================================================

[project]
name = "desempenho-enem-equidade"
version = "0.1.0"
description = "Modelo explicável da nota do ENEM por perfil socioeconômico e análise de equidade."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.mgf@gmail.com" }]
keywords = ["enem", "inep", "equidade", "fairness", "shap", "polars", "educação"]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Portuguese (Brazilian)",
]

# --- Dependências de runtime (cada uma justificada) --------------------------
dependencies = [
    # Configuração, validação e ambiente (src/config/)
    "pydantic>=2.13.5",                         # validação tipada das configurações
    "pydantic-settings>=2.15.0",                # configuração via YAML + variáveis de ambiente
    "python-dotenv>=1.2.3",                     # leitura do .env (pydantic-settings)
    "pyyaml>=6.0.3",                            # leitura dos arquivos em configs/

    # Dados: manipulação lazy, Parquet e contratos de dados
    "polars>=1.44.1",                           # scan_csv/sink_parquet lazy (substitui pandas)
    "pyarrow>=25.0.1",                          # backend Parquet e interoperabilidade com o SHAP
    "pandera[polars]>=0.33.1",                  # contratos de dados por camada (silver/gold)

    # Modelagem, estatística e explicabilidade
    "numpy>=2.2.6",                             # matrizes de features e reamostragem (bootstrap)
    "scipy>=1.15.3",                            # distribuição t (ICs e teste corrigido)
    "scikit-learn>=1.7.2",                      # KFold, OneHotEncoder e métricas
    "statsmodels>=0.15.0",                      # regressão linear de referência (OLS)
    "xgboost>=3.2.0",                           # gradient boosting
    "shap>=0.49.1",                             # explicabilidade (SHAP global e por grupo)
    "joblib>=1.6.0",                            # persistência dos modelos treinados

    # Visualização (reports/figures/)
    "matplotlib>=3.10.9",                       # figuras estáticas
    "seaborn>=0.13.2",                          # gráficos estatísticos

    # Terminal e progresso
    "rich>=15.0.0",                             # logging e barras de progresso
]

[tool.uv]
# O projeto não é instalado como pacote: `src/` é a raiz de importação (ver
# CLAUDE.md, "Import style"). O pytest resolve os imports por
# `pythonpath = ["src"]` e `src/main.py` insere o diretório em `sys.path` ao ser
# executado diretamente.
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# numba < 0.57.1 (puxado pelo shap) tem CVE-2024-28292.
constraint-dependencies = ["numba>=0.57.1"]
default-groups = ["dev", "quality", "docs"]

# --- Grupos de dependências (PEP 735) ----------------------------------------
# `dev` é o padrão; `quality` e `docs` entram em `default-groups` para que
# `uv sync --dev` (CI) e `make install` instalem tudo com um comando.
[dependency-groups]
dev = [
    "ruff>=0.5",                    # lint + format (substitui flake8/isort/black)
    "basedpyright>=1.13",           # type checking estático (CI, não pre-commit)
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.165.0",          # testes baseados em propriedades
    "pre-commit>=3.7",
    "commitizen>=4.16.5",           # Conventional Commits + CHANGELOG
    "detect-secrets>=1.5",          # impede commit de credenciais
    "nbstripout>=0.7",              # remove outputs de notebooks
    "nbqa>=1.8",                    # aplica linters a notebooks
    "ipykernel>=7.3.0",             # kernel Jupyter (VS Code / Data Wrangler)
    "jupyterlab>=4.6.3",
    "scalene>=1.5",                 # profiling sob demanda
]
quality = [
    "bandit>=1.7",                  # análise de segurança do código
    "pip-audit>=2.7",               # vulnerabilidades das dependências
    "vulture>=2.11",                # código morto
    "refurb>=2.0",                  # modernização de código
    "xenon>=0.9",                   # limites de complexidade
    "radon>=6.0",                   # métricas de complexidade
    "interrogate>=1.7",             # cobertura de docstrings
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[project.urls]
Homepage = "https://github.com/luanfreitas5/desempenho-enem-equidade"
Documentation = "https://luanfreitas5.github.io/desempenho-enem-equidade/"
Repository = "https://github.com/luanfreitas5/desempenho-enem-equidade"


# =============================================================================
# RUFF — lint + format (substitui flake8/isort/black)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (organização de imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear (bugs comuns e más práticas)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (usar Path em vez de os.path)
    "PD",     # pandas-vet — antipadrões específicos de pandas
    "S",      # flake8-bandit (segurança)
    "D",      # pydocstyle (docstrings NumPy, convenção abaixo)
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint — antipadrões de performance
    "RUF",    # regras específicas do próprio Ruff
    "PL",     # pylint (subconjunto)
    "TRY",    # tryceratops — boas práticas de exception handling
]
ignore = [
    "D203",    # conflita com D211 (convenção numpy)
    "D213",    # conflita com D212 (convenção numpy)
    "D401",    # heurística de modo imperativo só vale para inglês; docstrings são pt-BR
    "S101",    # assert usado só para estreitar tipos, após validação real (idem bandit B101)
    "S310",    # urlopen: esquema HTTPS é validado antes (idem bandit B310 com nosec)
    "PLR0913", # muitos argumentos em função — comum em pipelines de ML
    "PLR2004", # "magic value" em comparação — comum em thresholds de modelo
    "TRY003",  # mensagem longa em exceção customizada
    "PLR0917", # muitos parâmetros posicionais — comum em pipelines de ML
    "PLC0415", # import fora do topo — usado de propósito em testes e para evitar
               # ciclos de import (config.logging -> config.paths)
    "RUF001",  # caractere ambíguo em string — tipografia pt-BR intencional
    "RUF002",  # idem, em docstrings
    "PERF203", # try/except em loop — isola falhas por item (ano, modelo)
]

[tool.ruff.lint.isort]
# `src/` é a raiz de importação, então os pacotes de primeira parte são os
# diretórios dentro dele — não "src" em si.
known-first-party = [
    "config",
    "constants",
    "data",
    "evaluation",
    "exceptions",
    "explainability",
    "fairness",
    "features",
    "models",
    "pipelines",
    "preprocessing",
    "schemas",
    "training",
    "utils",
    "visualization",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # docstrings no formato NumPy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101", "N806", "D"]  # fixtures, valores fixos, asserts e `X` (convenção sklearn)
"tests/conftest.py" = ["E402", "ARG", "PLR2004", "D"]  # matplotlib.use("Agg") antes dos imports
# Notebooks: imports após células de código (E402), imports só para efeito
# colateral (F401), builtins do IPython como `display` (F821) e a semente
# global do cabeçalho padrão de notebook (NPY002) e expressões soltas no fim
# da célula, que o Jupyter renderiza como saída (B018).
"notebooks/*" = ["E402", "F401", "F821", "NPY002", "B018", "D"]
"src/main.py" = ["E402"]                # `src/` entra no sys.path antes de importar

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# BASEDPYRIGHT — type checking estático (roda no CI)
# =============================================================================
[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]
# `src/` é a raiz de importação: sem isto, `from config.settings import ...`
# não resolveria para o type checker.
extraPaths = ["src", "tests"]
exclude = ["**/__pycache__", "notebooks", "data", "models", "reports", "logs"]
reportMissingTypeStubs = false

# =============================================================================
# BANDIT — análise de segurança (roda no CI)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
# B101 (uso de `assert`): usados apenas para estreitamento de tipo, sempre
# precedidos de validação real que levanta exceção própria.
skips = ["B101"]

# =============================================================================
# VULTURE — detecção de código morto
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["notebooks/"]
# `cls` de validators Pydantic e parâmetros exigidos pela API do
# scikit-learn/context managers (`y`, `exc_info`) nunca são usados no corpo.
ignore_decorators = ["@field_validator", "@model_validator"]
ignore_names = ["cls", "y", "exc_info"]

# =============================================================================
# REFURB — sugestões de modernização
# =============================================================================
[tool.refurb]
ignore = [
    "FURB105",  # print() sem parênteses vazios — inofensivo
    "FURB126",  # return implícito — às vezes reduz clareza em funções longas
    # FURB123 (cast redundante): `float(x)` é necessário para converter escalares
    # NumPy em `float` nativo (serialização JSON).
    "FURB123",
]

# =============================================================================
# PYTEST — testes (unit, integração, property-based, comportamentais)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "smoke: testes rápidos rodados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "ml: testes comportamentais / de regressão de métrica",
    "slow: testes lentos (pulados por padrão localmente)",
]

# =============================================================================
# COVERAGE — meta de cobertura ≥ 80%
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",           # orquestração fina (CLI), coberta indiretamente
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80  # coverage.py exige underscore em pyproject (com hífen era ignorado)
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# =============================================================================
# INTERROGATE — cobertura de docstrings
# =============================================================================
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# =============================================================================
# COMMITIZEN — Conventional Commits + SemVer + CHANGELOG
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "src/__init__.py:__version__",
    "configs/config.yaml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true  # remove quando sair do 0.x
